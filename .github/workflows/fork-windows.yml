name: "Fork Build"

# Unsigned Windows x64 installer and Linux x64 AppImage for this fork.
# tauri.conf.json in the fork has no sign command and no updater artifacts,
# since upstream's signing keys are not available here.
on:
  workflow_dispatch:

jobs:
  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      sign-binaries: false
      asset-prefix: "handy-fork"
      upload-artifacts: true
    secrets: inherit

  linux:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-24.04"
      target: "x86_64-unknown-linux-gnu"
      build-args: "--bundles appimage"
      sign-binaries: false
      asset-prefix: "handy-fork"
      upload-artifacts: true
    secrets: inherit
